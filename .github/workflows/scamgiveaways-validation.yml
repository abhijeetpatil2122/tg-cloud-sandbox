name: ScamGiveawaysBot validation

on:
  push:
    branches: [main]
    paths:
      - "bots/ScamGiveawaysBot/**"
      - ".github/workflows/scamgiveaways-validation.yml"
  pull_request:
    paths:
      - "bots/ScamGiveawaysBot/**"
      - ".github/workflows/scamgiveaways-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/ScamGiveawaysBot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bots/ScamGiveawaysBot/package-lock.json
      - name: Install CLI dependencies
        run: npm ci
      - name: Check runtime JavaScript syntax
        run: |
          set -euo pipefail
          find tgcloud -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
