name: One-time BotZoneBot demo_notes cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-botzonebot-demo-notes-cleanup.yml"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed database migration
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          cd bots/BotZoneBot
          npm install --no-audit --no-fund
          npx tgcloud fetch
          npx tgcloud status
          npx tgcloud migrate --yes
