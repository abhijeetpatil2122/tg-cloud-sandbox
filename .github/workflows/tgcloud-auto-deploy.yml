name: Telegram Serverless Auto Deploy

on:
  push:
    branches:
      - main
    paths:
      - "bots/**"

permissions:
  contents: read

jobs:
  detect:
    name: Detect deployable bot changes
    runs-on: ubuntu-latest
    outputs:
      changed_bots: ${{ steps.detect.outputs.changed_bots }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find bot directories with deployable changes
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          before = os.environ["BEFORE_SHA"]
          after = os.environ["AFTER_SHA"]
          if not before or set(before) == {"0"}:
              changed_files = subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", after], text=True
              ).splitlines()
          else:
              changed_files = subprocess.check_output(
                  ["git", "diff", "--name-only", before, after], text=True
              ).splitlines()

          changed_bots = set()
          bot_names = {
              parts[1]
              for path in changed_files
              for parts in [path.split("/")]
              if len(parts) >= 3 and parts[0] == "bots"
          }
          deployable_root_files = {"package.json", "package-lock.json", "tgcloud.jsonc"}
          documentation_files = {"README.md", "AGENTS.md", ".gitignore"}

          for bot_name in bot_names:
              bot_root = f"bots/{bot_name}"
              try:
                  config = subprocess.check_output(
                      ["git", "show", f"{after}:{bot_root}/tgcloud.jsonc"],
                      text=True, stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  config = ""
              has_static_frontend = re.search(r'"static"\s*:', config) is not None

              for path in changed_files:
                  if not path.startswith(f"{bot_root}/"):
                      continue
                  relative = path[len(bot_root) + 1:]
                  if (
                      relative.startswith("tgcloud/")
                      or relative in deployable_root_files
                      or (
                          has_static_frontend
                          and relative not in documentation_files
                          and not relative.startswith("docs/")
                      )
                  ):
                      changed_bots.add(bot_root)
                      break

          result = json.dumps(sorted(changed_bots), separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed_bots={result}\n")
          print(f"Deployable bot directories changed: {result}")
          PY

  validate:
    name: Validate changed bot projects
    needs: detect
    if: needs.detect.outputs.changed_bots != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bot_path: ${{ fromJSON(needs.detect.outputs.changed_bots) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out workspace
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        env:
          BOT_PATH: ${{ matrix.bot_path }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          npm install --no-audit --no-fund

      - name: Validate Serverless JavaScript modules
        env:
          BOT_PATH: ${{ matrix.bot_path }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          while IFS= read -r module; do
            echo "Checking $module"
            node --check "$module"
          done < <(find tgcloud -type f -name '*.js' | sort)

      - name: Build Mini App frontend when configured
        env:
          BOT_PATH: ${{ matrix.bot_path }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          if grep -Eq '"static"[[:space:]]*:' tgcloud.jsonc; then
            npm run build
          fi
  auto-deploy:
    name: Auto deploy ${{ matrix.bot_path }}
    needs: [detect, validate]
    if: needs.detect.outputs.changed_bots != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # These bots have verified app IDs and repository secrets.
          - bot_path: bots/IdPullBot
            app_id: "8288436618"
            auto_deploy: true
            secret_key: TGCLOUD_TOKEN_IDPULLBOT
          - bot_path: bots/RichDocsBot
            app_id: "8626465761"
            auto_deploy: true
            secret_key: TGCLOUD_TOKEN_RICHDOCSBOT
          - bot_path: bots/BotZoneBot
            app_id: "8747772496"
            auto_deploy: true
            secret_key: TGCLOUD_TOKEN

    concurrency:
      group: tgcloud-auto-${{ matrix.bot_path }}-${{ github.ref }}
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    env:
      BOT_PATH: ${{ matrix.bot_path }}
      EXPECTED_APP_ID: ${{ matrix.app_id }}

    steps:
      - name: Check out workspace
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate project and install CLI
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        run: |
          set -euo pipefail
          if [[ ! "$BOT_PATH" =~ ^bots/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::bot_path must point to a single directory directly under bots/."
            exit 1
          fi
          if [[ ! -f "$BOT_PATH/package.json" || ! -f "$BOT_PATH/tgcloud.jsonc" || ! -d "$BOT_PATH/tgcloud" ]]; then
            echo "::error::The selected folder is not a tgcloud project: $BOT_PATH"
            exit 1
          fi
          cd "$BOT_PATH"
          npm install --no-audit --no-fund

      - name: Validate JavaScript module syntax
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          mapfile -t modules < <(
            find tgcloud -type f -name '*.js' \
              \( -path 'tgcloud/schema.js' -o -path 'tgcloud/lib/*' -o -path 'tgcloud/handlers/*' -o -path 'tgcloud/endpoints/*' \) \
              -print | sort
          )
          if (( ${#modules[@]} == 0 )); then
            echo "::error::No deployable JavaScript modules were found."
            exit 1
          fi
          for module in "${modules[@]}"; do
            echo "Checking $module"
            node --check "$module"
          done

      - name: Validate CLI token matches the configured app
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        env:
          TGCLOUD_TOKEN: ${{ matrix.bot_path == 'bots/IdPullBot' && secrets.TGCLOUD_TOKEN_IDPULLBOT || matrix.bot_path == 'bots/RichDocsBot' && secrets.TGCLOUD_TOKEN_RICHDOCSBOT || matrix.bot_path == 'bots/BotZoneBot' && secrets.TGCLOUD_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${TGCLOUD_TOKEN:-}" ]]; then
            echo "::error::The required Actions secret for $BOT_PATH is missing."
            exit 1
          fi
          if [[ ! "$TGCLOUD_TOKEN" =~ ^app([0-9]+):.+$ ]]; then
            echo "::error::The configured secret is not a valid-looking Telegram Serverless CLI token."
            exit 1
          fi
          token_app_id="${BASH_REMATCH[1]}"
          if [[ ! "$EXPECTED_APP_ID" =~ ^[0-9]+$ || "$token_app_id" != "$EXPECTED_APP_ID" ]]; then
            echo "::error::The token app ID does not match the configured app ID. No deploy was attempted."
            exit 1
          fi

      - name: Fetch cloud state and show status
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        env:
          TGCLOUD_TOKEN: ${{ matrix.bot_path == 'bots/IdPullBot' && secrets.TGCLOUD_TOKEN_IDPULLBOT || matrix.bot_path == 'bots/RichDocsBot' && secrets.TGCLOUD_TOKEN_RICHDOCSBOT || matrix.bot_path == 'bots/BotZoneBot' && secrets.TGCLOUD_TOKEN || '' }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          npx tgcloud fetch
          npx tgcloud status

      - name: Run one-time Telegraph API and compiler diagnostic
        if: github.event.head_commit.message == 'Run isolated Telegraph live API test and deploy' && matrix.bot_path == 'bots/IdPullBot' && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN_IDPULLBOT }}
        run: |
          set -euo pipefail
          cd bots/IdPullBot
          npx tgcloud run handlers/message '{chat: {id: 1314643983, type: "private"}, from: {id: 1314643983}, text: "/testtelegraph", message_id: 1}'

      - name: Deploy selected bot modules
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        env:
          TGCLOUD_TOKEN: ${{ matrix.bot_path == 'bots/IdPullBot' && secrets.TGCLOUD_TOKEN_IDPULLBOT || matrix.bot_path == 'bots/RichDocsBot' && secrets.TGCLOUD_TOKEN_RICHDOCSBOT || matrix.bot_path == 'bots/BotZoneBot' && secrets.TGCLOUD_TOKEN || '' }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          if grep -Eq '"static"[[:space:]]*:' tgcloud.jsonc; then
            # Full push atomically deploys static assets and modules. It mirrors
            # local modules to the cloud, including deletions.
            npm run build
            printf 'Auto-deploying Mini App and modules to app ID %s\n' "$EXPECTED_APP_ID"
            npx tgcloud push
          else
            mapfile -t modules < <(
              find tgcloud -type f -name '*.js' \
                \( -path 'tgcloud/schema.js' -o -path 'tgcloud/lib/*' -o -path 'tgcloud/handlers/*' -o -path 'tgcloud/endpoints/*' \) \
                -print | sort
            )
            if (( ${#modules[@]} == 0 )); then
              echo "::error::No deployable JavaScript modules were found."
              exit 1
            fi
            printf 'Auto-deploying %s module(s) to app ID %s\n' "${#modules[@]}" "$EXPECTED_APP_ID"
            npx tgcloud push "${modules[@]}"
          fi
          npx tgcloud status
