name: Telegram Serverless Auto Deploy

on:
  push:
    branches:
      - main
    paths:
      - "bots/**"
      - ".github/workflows/tgcloud-auto-deploy.yml"
  pull_request:
    paths:
      - "bots/**"
      - ".github/workflows/tgcloud-auto-deploy.yml"

permissions:
  contents: read

jobs:
  detect:
    name: Detect deployable bot changes
    runs-on: ubuntu-latest
    outputs:
      changed_bots: ${{ steps.detect.outputs.changed_bots }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find bot directories with deployable changes
        id: detect
        env:
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          before = os.environ["BEFORE_SHA"]
          after = os.environ["AFTER_SHA"]
          if not before or set(before) == {"0"}:
              changed_files = subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", after], text=True
              ).splitlines()
          else:
              changed_files = subprocess.check_output(
                  ["git", "diff", "--name-only", before, after], text=True
              ).splitlines()

          changed_bots = set()
          bot_names = {
              parts[1]
              for path in changed_files
              for parts in [path.split("/")]
              if len(parts) >= 3 and parts[0] == "bots"
          }
          deployable_root_files = {"package.json", "package-lock.json", "tgcloud.jsonc"}
          documentation_files = {"README.md", "AGENTS.md", ".gitignore"}

          for bot_name in bot_names:
              bot_root = f"bots/{bot_name}"
              try:
                  config = subprocess.check_output(
                      ["git", "show", f"{after}:{bot_root}/tgcloud.jsonc"],
                      text=True, stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  config = ""
              has_static_frontend = re.search(r'"static"\s*:', config) is not None

              for path in changed_files:
                  if not path.startswith(f"{bot_root}/"):
                      continue
                  relative = path[len(bot_root) + 1:]
                  if (
                      relative.startswith("tgcloud/")
                      or relative in deployable_root_files
                      or (
                          has_static_frontend
                          and relative not in documentation_files
                          and not relative.startswith("docs/")
                      )
                  ):
                      changed_bots.add(bot_root)
                      break

          result = json.dumps(sorted(changed_bots), separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed_bots={result}\n")
          print(f"Deployable bot directories changed: {result}")
          PY

  validate:
    name: Validate changed bot projects
    needs: detect
    if: needs.detect.outputs.changed_bots != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bot_path: ${{ fromJSON(needs.detect.outputs.changed_bots) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out workspace
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        env:
          BOT_PATH: ${{ matrix.bot_path }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          npm install --no-audit --no-fund

      - name: Validate Serverless JavaScript modules
        env:
          BOT_PATH: ${{ matrix.bot_path }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          while IFS= read -r module; do
            echo "Checking $module"
            node --check "$module"
          done < <(find tgcloud -type f -name '*.js' | sort)

      - name: Build Mini App frontend when configured
        env:
          BOT_PATH: ${{ matrix.bot_path }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          if grep -Eq '"static"[[:space:]]*:' tgcloud.jsonc; then
            npm run build
          fi
  auto-deploy:
    name: Auto deploy ${{ matrix.bot_path }}
    needs: [detect, validate]
    if: github.event_name == 'push' && needs.detect.outputs.changed_bots != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # These bots have verified app IDs and repository secrets.
          - bot_path: bots/IdPullBot
            app_id: "8288436618"
            auto_deploy: true
            secret_key: TGCLOUD_TOKEN_IDPULLBOT
          - bot_path: bots/RichDocsBot
            app_id: "8626465761"
            auto_deploy: true
            secret_key: TGCLOUD_TOKEN_RICHDOCSBOT
          - bot_path: bots/BotZoneBot
            app_id: "8747772496"
            auto_deploy: true
            secret_key: TGCLOUD_TOKEN
          - bot_path: bots/TgRichBot
            app_id: "FROM_TOKEN"
            auto_deploy: true
            secret_key: TGCLOUD_TOKEN_TGRICHBOT

    concurrency:
      group: tgcloud-auto-${{ matrix.bot_path }}-${{ github.ref }}
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    env:
      BOT_PATH: ${{ matrix.bot_path }}
      EXPECTED_APP_ID: ${{ matrix.app_id }}

    steps:
      - name: Check out workspace
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate project and install CLI
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        run: |
          set -euo pipefail
          if [[ ! "$BOT_PATH" =~ ^bots/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::bot_path must point to a single directory directly under bots/."
            exit 1
          fi
          if [[ ! -f "$BOT_PATH/package.json" || ! -f "$BOT_PATH/tgcloud.jsonc" || ! -d "$BOT_PATH/tgcloud" ]]; then
            echo "::error::The selected folder is not a tgcloud project: $BOT_PATH"
            exit 1
          fi
          cd "$BOT_PATH"
          npm install --no-audit --no-fund

      - name: Validate JavaScript module syntax
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          mapfile -t modules < <(
            find tgcloud -type f -name '*.js' \
              \( -path 'tgcloud/schema.js' -o -path 'tgcloud/lib/*' -o -path 'tgcloud/handlers/*' -o -path 'tgcloud/endpoints/*' \) \
              -print | sort
          )
          if (( ${#modules[@]} == 0 )); then
            echo "::error::No deployable JavaScript modules were found."
            exit 1
          fi
          for module in "${modules[@]}"; do
            echo "Checking $module"
            node --check "$module"
          done

      - name: Validate CLI token matches the configured app
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        env:
          TGCLOUD_TOKEN: ${{ matrix.bot_path == 'bots/IdPullBot' && secrets.TGCLOUD_TOKEN_IDPULLBOT || matrix.bot_path == 'bots/RichDocsBot' && secrets.TGCLOUD_TOKEN_RICHDOCSBOT || matrix.bot_path == 'bots/BotZoneBot' && secrets.TGCLOUD_TOKEN || matrix.bot_path == 'bots/TgRichBot' && (secrets.TGCLOUD_TOKEN_TGRICHBOT || vars.TGCLOUD_TOKEN_TGRICHBOT) || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${TGCLOUD_TOKEN:-}" ]]; then
            echo "::error::The required Actions secret for $BOT_PATH is missing."
            exit 1
          fi
          if [[ ! "$TGCLOUD_TOKEN" =~ ^app([0-9]+):.+$ ]]; then
            echo "::error::The configured secret is not a valid-looking Telegram Serverless CLI token."
            exit 1
          fi
          token_app_id="${BASH_REMATCH[1]}"
          if [[ "$EXPECTED_APP_ID" == "FROM_TOKEN" ]]; then
            echo "EXPECTED_APP_ID=$token_app_id" >> "$GITHUB_ENV"
            echo "Using the verified app ID encoded in the TgRichBot token."
          elif [[ ! "$EXPECTED_APP_ID" =~ ^[0-9]+$ || "$token_app_id" != "$EXPECTED_APP_ID" ]]; then
            echo "::error::The token app ID does not match the configured app ID. No deploy was attempted."
            exit 1
          fi

      - name: Fetch cloud state and show status
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        env:
          TGCLOUD_TOKEN: ${{ matrix.bot_path == 'bots/IdPullBot' && secrets.TGCLOUD_TOKEN_IDPULLBOT || matrix.bot_path == 'bots/RichDocsBot' && secrets.TGCLOUD_TOKEN_RICHDOCSBOT || matrix.bot_path == 'bots/BotZoneBot' && secrets.TGCLOUD_TOKEN || matrix.bot_path == 'bots/TgRichBot' && secrets.TGCLOUD_TOKEN_TGRICHBOT || '' }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          npx tgcloud fetch
          npx tgcloud status

      - name: Deploy selected bot modules
        if: matrix.auto_deploy && contains(fromJSON(needs.detect.outputs.changed_bots), matrix.bot_path)
        env:
          TGCLOUD_TOKEN: ${{ matrix.bot_path == 'bots/IdPullBot' && secrets.TGCLOUD_TOKEN_IDPULLBOT || matrix.bot_path == 'bots/RichDocsBot' && secrets.TGCLOUD_TOKEN_RICHDOCSBOT || matrix.bot_path == 'bots/BotZoneBot' && secrets.TGCLOUD_TOKEN || matrix.bot_path == 'bots/TgRichBot' && secrets.TGCLOUD_TOKEN_TGRICHBOT || '' }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          # tgcloud CLI can apply remote changes and then fail while serializing
          # boolean false into its local snapshot. Suppress only that exact
          # post-deploy failure; all other deployment errors remain fatal.
          push_with_snapshot_workaround() {
            local output rc=0
            output="$(npx tgcloud push "$@" 2>&1)" || rc=$?
            printf '%s\n' "$output"
            if (( rc == 0 )); then
              return 0
            fi
            if grep -Eq 'Deploying [0-9]+ changes?' <<< "$output" &&
               grep -q 'writeSnapshotFile' <<< "$output" &&
               grep -q 'ERR_INVALID_ARG_TYPE' <<< "$output" &&
               [[ "$output" == *"Received type boolean (false)"* ]]; then
              echo "::warning::Remote changes were applied, but tgcloud CLI failed saving its local snapshot. Verifying deployed cloud status."
              return 0
            fi
            return "$rc"
          }
          if [[ "$BOT_PATH" == "bots/TgRichBot" ]]; then
            # Resolve the production Mini App URL from the verified token ID.
            sed -i "s/__TGCLOUD_APP_ID__/$EXPECTED_APP_ID/g" tgcloud/lib/botMessages.js
            if grep -q '__TGCLOUD_APP_ID__' tgcloud/lib/botMessages.js; then
              echo "::error::Failed to resolve the production Mini App URL."
              exit 1
            fi
          fi
          if grep -Eq '"static"[[:space:]]*:' tgcloud.jsonc; then
            # Full push atomically deploys static assets and modules. It mirrors
            # local modules to the cloud, including deletions.
            npm run build
            printf 'Auto-deploying Mini App and modules to app ID %s\n' "$EXPECTED_APP_ID"
            push_with_snapshot_workaround
          else
            mapfile -t modules < <(
              find tgcloud -type f -name '*.js' \
                \( -path 'tgcloud/schema.js' -o -path 'tgcloud/lib/*' -o -path 'tgcloud/handlers/*' -o -path 'tgcloud/endpoints/*' \) \
                -print | sort
            )
            if (( ${#modules[@]} == 0 )); then
              echo "::error::No deployable JavaScript modules were found."
              exit 1
            fi
            printf 'Auto-deploying %s module(s) to app ID %s\n' "${#modules[@]}" "$EXPECTED_APP_ID"
            push_with_snapshot_workaround "${modules[@]}"
          fi
          # Pushing schema.js records pending changes. Apply safe schema
          # migrations for both editor instances, never auto-applying warnings.
          if [[ "$BOT_PATH" == "bots/BotZoneBot" || "$BOT_PATH" == "bots/TgRichBot" ]]; then
            echo "Applying safe database migrations for $BOT_PATH"
            npx tgcloud migrate --safe

            # Exercise the exact session-start path against the deployed
            # Serverless runtime. Use a unique test session and always remove it.
            smoke_upload_id="ci_upload_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
            smoke_user_id=900000001
            npx tgcloud run endpoints/beginMediaUpload "{ upload_id: '${smoke_upload_id}', kind: 'document', name: 'upload-smoke-test.bin', type: 'application/octet-stream', size: 5, total_chunks: 1 }" --ctx "{ initData: { user: { id: ${smoke_user_id} } } }"
            npx tgcloud run endpoints/uploadMediaChunk "{ upload_id: '${smoke_upload_id}', index: 0, base64: '-__-AAE' }" --ctx "{ initData: { user: { id: ${smoke_user_id} } } }"
            npx tgcloud run endpoints/cancelMediaUpload "{ upload_id: '${smoke_upload_id}' }" --ctx "{ initData: { user: { id: ${smoke_user_id} } } }"
          fi
          npx tgcloud status
