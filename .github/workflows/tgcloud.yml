name: Telegram Serverless CLI

on:
  workflow_dispatch:
    inputs:
      bot_path:
        description: "Bot folder to use (for example bots/BotZoneBot)"
        required: true
        default: "bots/BotZoneBot"
        type: string
      expected_app_id:
        description: "Numeric app ID from this bot's CLI token (app<id>:...)"
        required: true
        type: string
      mode:
        description: "Check the selected bot or deploy its modules"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - deploy

permissions:
  contents: read

concurrency:
  group: tgcloud-${{ inputs.bot_path }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: CLI check / deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      BOT_PATH: ${{ inputs.bot_path }}
      EXPECTED_APP_ID: ${{ inputs.expected_app_id }}
      DEPLOY_MODE: ${{ inputs.mode }}
    steps:
      - name: Check out workspace
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate project and install CLI
        run: |
          set -euo pipefail
          if [[ ! "$BOT_PATH" =~ ^bots/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::bot_path must point to a single directory directly under bots/."
            exit 1
          fi
          if [[ ! -f "$BOT_PATH/package.json" || ! -f "$BOT_PATH/tgcloud.jsonc" || ! -d "$BOT_PATH/tgcloud" ]]; then
            echo "::error::The selected folder is not a tgcloud project: $BOT_PATH"
            exit 1
          fi
          cd "$BOT_PATH"
          npm install --no-audit --no-fund

      - name: Validate JavaScript module syntax
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          mapfile -t modules < <(
            find tgcloud -type f -name '*.js' \
              \( -path 'tgcloud/schema.js' -o -path 'tgcloud/lib/*' -o -path 'tgcloud/handlers/*' -o -path 'tgcloud/endpoints/*' \) \
              -print | sort
          )
          if (( ${#modules[@]} == 0 )); then
            echo "::error::No deployable JavaScript modules were found."
            exit 1
          fi
          for module in "${modules[@]}"; do
            echo "Checking $module"
            node --check "$module"
          done

      - name: Build Mini App frontend when configured
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          if grep -Eq '"static"[[:space:]]*:' tgcloud.jsonc; then
            npm run build
          fi

      - name: Validate CLI token matches selected app
        env:
          TGCLOUD_TOKEN: ${{ inputs.bot_path == 'bots/BotZoneBot' && secrets.TGCLOUD_TOKEN || inputs.bot_path == 'bots/RichDocsBot' && secrets.TGCLOUD_TOKEN_RICHDOCSBOT || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${TGCLOUD_TOKEN:-}" ]]; then
            echo "::error::Add the Actions secret mapped to the selected bot_path (TGCLOUD_TOKEN for BotZoneBot; TGCLOUD_TOKEN_RICHDOCSBOT for RichDocsBot)."
            exit 1
          fi
          if [[ ! "$TGCLOUD_TOKEN" =~ ^app([0-9]+):.+$ ]]; then
            echo "::error::TGCLOUD_TOKEN does not look like a Telegram Serverless CLI token."
            exit 1
          fi
          token_app_id="${BASH_REMATCH[1]}"
          if [[ ! "$EXPECTED_APP_ID" =~ ^[0-9]+$ || "$token_app_id" != "$EXPECTED_APP_ID" ]]; then
            echo "::error::The token app ID does not match expected_app_id. Check the selected bot and secret; no deploy was attempted."
            exit 1
          fi

      - name: Fetch cloud state and show status
        env:
          TGCLOUD_TOKEN: ${{ inputs.bot_path == 'bots/BotZoneBot' && secrets.TGCLOUD_TOKEN || inputs.bot_path == 'bots/RichDocsBot' && secrets.TGCLOUD_TOKEN_RICHDOCSBOT || '' }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          npx tgcloud fetch
          npx tgcloud status

      - name: Deploy selected bot project
        if: inputs.mode == 'deploy'
        env:
          TGCLOUD_TOKEN: ${{ inputs.bot_path == 'bots/BotZoneBot' && secrets.TGCLOUD_TOKEN || inputs.bot_path == 'bots/RichDocsBot' && secrets.TGCLOUD_TOKEN_RICHDOCSBOT || '' }}
        run: |
          set -euo pipefail
          cd "$BOT_PATH"
          if grep -Eq '"static"[[:space:]]*:' tgcloud.jsonc; then
            # Full push deploys static build output and Serverless modules together.
            # It mirrors the local module set to the cloud, including deletions.
            npm run build
            npx tgcloud push
          else
            mapfile -t modules < <(
              find tgcloud -type f -name '*.js' \
                \( -path 'tgcloud/schema.js' -o -path 'tgcloud/lib/*' -o -path 'tgcloud/handlers/*' -o -path 'tgcloud/endpoints/*' \) \
                -print | sort
            )
            if (( ${#modules[@]} == 0 )); then
              echo "::error::No deployable JavaScript modules were found."
              exit 1
            fi
            printf 'Deploying %s module(s) to app ID %s\n' "${#modules[@]}" "$EXPECTED_APP_ID"
            # Targeted push updates only these modules and avoids deleting unrelated cloud modules.
            npx tgcloud push "${modules[@]}"
          fi
          npx tgcloud status
