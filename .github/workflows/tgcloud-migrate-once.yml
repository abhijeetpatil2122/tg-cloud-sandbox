name: One-time BotZoneBot SQLite migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tgcloud-migrate-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Remove one-time BotZoneBot SQLite migration workflow'
    name: Apply reviewed additive SQLite changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bots/BotZoneBot/package-lock.json

      - name: Install project dependencies
        working-directory: bots/BotZoneBot
        run: npm ci

      - name: Apply safe schema migrations only
        working-directory: bots/BotZoneBot
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud migrate --safe

      - name: Remove this one-time workflow
        if: success()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tgcloud-migrate-once.yml
          git commit -m "Remove one-time BotZoneBot SQLite migration workflow"
          git push
